name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test

  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep (fail on errors/critical)
        run: semgrep scan --config=auto --error --severity=ERROR

  build-scan:
    needs: [test, sast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (load to local daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sample-nodejs:ci
      - name: Trivy scan (block HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: sample-nodejs:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
